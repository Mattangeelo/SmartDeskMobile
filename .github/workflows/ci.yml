name: Validate mobile
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: '1'
